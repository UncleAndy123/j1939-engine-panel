name: Build & release

# Releases are driven by __version__ in j1939_engine_panel.py:
#   - Push to main with a new __version__  -> build the exe and publish release vX.Y.Z (tag created automatically)
#   - Push to main with an unchanged version -> nothing to do
#   - Push a tag vX.Y.Z (must match __version__) -> build and publish that release
#   - Run manually (Actions tab)             -> build; publish if that version isn't released yet
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need tags to see what's already released
      - id: v
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' j1939_engine_panel.py)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$VER" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VER"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "v$VER is already released - nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VER - will build and publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 32-bit Python: RP1210 adapter drivers (Cummins INLINE etc.) are 32-bit DLLs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial sounddevice

      - name: Version resource
        run: python build/make_version_info.py version_info.txt

      - name: Import smoke test
        run: python -c "import j1939_engine_panel as m; print(m.APP_NAME, m.__version__)"

      - name: Audio library check (bundled 32-bit PortAudio)
        run: python -c "import sounddevice as sd; print(sd.get_portaudio_version())"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name J1939EnginePanel
          --icon assets/icon.ico
          --add-data "assets;assets"
          --version-file version_info.txt
          j1939_engine_panel.py

      - uses: actions/upload-artifact@v4
        with:
          name: J1939EnginePanel-v${{ needs.check.outputs.version }}
          path: dist/J1939EnginePanel.exe

      - name: Publish release
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: J1939 Engine Panel v${{ needs.check.outputs.version }}
          body_path: CHANGELOG-latest.md
          files: dist/J1939EnginePanel.exe
          fail_on_unmatched_files: true
